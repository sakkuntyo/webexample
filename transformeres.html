<!doctype html>
<html>
  <body>
    <textarea id="prompt" rows="6" cols="60">hi</textarea>
    <br>
    <button id="run">Run</button>
    <pre id="out"></pre>

    <script type="module">
      import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";

      const out = document.getElementById("out");
      let generator;

      document.getElementById("run").onclick = async () => {
        try {
          out.textContent = "loading model...";
          if (!generator) {
            generator = await pipeline(
              "text-generation",
              "HuggingFaceTB/SmolLM2-360M-Instruct",
              {
                device: "wasm"
              }
            );
          }

          out.textContent = "running...";
          const result = await generator(document.getElementById("prompt").value, {
            max_new_tokens: 40,
          });

          out.textContent = JSON.stringify(result, null, 2);
        } catch (e) {
          out.textContent = "ERROR:\n" + (e?.stack || e?.message || String(e));
          console.error(e);
        }
      };
    </script>
  </body>
</html>
